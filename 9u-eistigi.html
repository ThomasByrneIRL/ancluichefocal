<!DOCTYPE html>
<html lang="ga">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Éistigí</title>
<script>
// Fréamh dialect choice, set on the hub: C = Connacht (default), U = Ulaidh, M = Mumhain.
// Swaps the teanglann.ie recording to the chosen dialect; falls back to Connacht if a word has no recording.
(function(){
  var d='C';try{d=localStorage.getItem('freamh_canuint')||'C';}catch(e){}
  if(!/^[CUM]$/.test(d))d='C';
  window.FREAMH_CANUINT=d;
  if(d==='C')return;
  var A=window.Audio;
  var W=function(src){
    var s=src==null?src:String(src), hit=s&&s.indexOf('/CanC/')>=0;
    var a=new A(hit?s.replace('/CanC/','/Can'+d+'/'):src);
    if(hit){
      var want=false,p=a.play.bind(a);
      a.play=function(){want=true;return p();};
      a.addEventListener('error',function(){if(a._fb)return;a._fb=1;a.src=s;a.load();if(want)p().catch(function(){});});
    }
    return a;
  };
  W.prototype=A.prototype;window.Audio=W;
  var L={U:'Fuaim Uladh',M:'Fuaim na Mumhan'};
  document.addEventListener('DOMContentLoaded',function(){
    var t=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),n;
    while((n=t.nextNode()))if(n.nodeValue.indexOf('Fuaim Chonnacht')>=0)n.nodeValue=n.nodeValue.replace(/Fuaim Chonnacht/g,L[d]);
  });
})();
</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f5f0; color: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .screen { display: none; text-align: center; padding: 2rem 1.2rem; max-width: 560px; width: 100%; }
  h1 { font-size: 2.2rem; color: #e94560; margin-bottom: .5rem; }
  .sub { color: #888; font-size: .9rem; margin-bottom: 1.4rem; }
  .rules { color: #555; line-height: 1.9; margin-bottom: 1.6rem; font-weight: bold; }
  .big-btn { background: #e94560; color: #fff; border: none; border-radius: 12px; padding: 1rem 2.5rem; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: .6rem; }
  .ghost-btn { background: transparent; color: #888; border: 1.5px solid #ddd; border-radius: 12px; padding: .9rem 1.8rem; font-size: 1rem; cursor: pointer; margin: .6rem 0 0 .5rem; }
  .best { color: #e07b00; font-size: .95rem; min-height: 1.3em; margin-top: .6rem; }

  /* top bar */
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .6rem; }
  .lbl { color: #888; font-size: .8rem; margin-right: .3rem; }
  #score { color: #2a9d47; font-size: 1.5rem; font-weight: bold; }
  #clock { font-size: 1.2rem; font-weight: bold; font-variant-numeric: tabular-nums; }
  #clock.low { color: #c0392b; }
  .gbar { height: 4px; background: #e3e3dc; border-radius: 2px; overflow: hidden; margin-bottom: .7rem; }
  #gbar { height: 100%; width: 100%; background: #888; }
  /* segmented word timer: left = last second (+1), right = first second (+4) */
  #segs { display: flex; gap: 3px; height: 8px; margin-bottom: 1.1rem; }
  #segs .seg { flex: 1; background: #e3e3dc; border-radius: 2px; overflow: hidden; }
  #segs .seg > i { display: block; height: 100%; width: 100%; }

  /* letter tiles: every tile the same size, only vowels can be tapped */
  .card { background: #fff; border-radius: 16px; padding: 1.4rem .8rem 1rem; box-shadow: 0 2px 16px rgba(0,0,0,.08); margin-bottom: .9rem; }
  #tiles { display: flex; justify-content: center; gap: var(--gap, 5px); }
  .tile { width: var(--tw, 44px); height: calc(var(--tw, 44px) * 1.25); border-radius: 8px;
          display: flex; align-items: center; justify-content: center;
          font-size: calc(var(--tw, 44px) * .6); font-weight: bold; user-select: none; flex-shrink: 0; }
  .tile.cons { background: #ececE6; color: #888; }
  .tile.vow { background: #fff; color: #1a1a2e; border: 2px solid #1565c0; cursor: pointer; transition: background .1s; }
  .tile.vow.on { background: #1565c0; color: #fff; }
  .tile.ok   { background: #2a9d47 !important; border-color: #2a9d47 !important; color: #fff !important; }
  .tile.bad  { background: #e94560 !important; border-color: #e94560 !important; color: #fff !important; }
  .tile.miss { background: #fff !important; border: 2px dashed #e94560 !important; color: #e94560 !important; }
  #meaning { color: #aaa; font-size: .85rem; margin-top: .9rem; min-height: 1.2em; }
  #answer { font-size: 1.3rem; font-weight: bold; min-height: 1.6em; margin-top: .3rem; color: #1a1a2e; }
  .row { display: flex; gap: .6rem; justify-content: center; align-items: center; }
  #listen { background: #fff; border: 2px solid #ddd; border-radius: 12px; padding: .8rem 1.1rem; font-size: 1.1rem; cursor: pointer; }
  #check { background: #1a1a2e; color: #fff; border: none; border-radius: 12px; padding: .85rem 2rem; font-size: 1.05rem; font-weight: bold; cursor: pointer; }
  #check:disabled, #listen:disabled { opacity: .5; cursor: default; }
  #flash { font-size: 1.3rem; font-weight: bold; color: #4caf50; height: 1.7rem; margin-top: .6rem; opacity: 0; transition: opacity .25s; }
  #final { font-size: 4rem; font-weight: bold; color: #2a9d47; margin: .4rem 0; }
</style>
</head>

<div id="start-screen" class="screen">
  <h1>Éistigí</h1>
  <p class="sub">Cá bhfuil an síneadh fada? · 🔊 Fuaim Chonnacht</p>
  <p class="rules">Éist leis an bhfocal.<br>Tapáil gach guta a bhfuil síneadh fada air.<br>60 soicind · níos mó ama d'fhocail fhada · +4 / +3 / +2 / +1<br>Pointí páirte má tá cuid de na sínte fada ceart</p>
  <button class="big-btn" onclick="startGame()">Tosaigh</button>
  <div class="best" id="best-start"></div>
</div>

<div id="game-screen" class="screen">
  <div class="top">
    <span><span class="lbl">Pointí</span><span id="score">0</span></span>
    <span id="clock">1:00</span>
  </div>
  <div class="gbar"><div id="gbar"></div></div>
  <div id="segs"></div>
  <div class="card">
    <div id="tiles"></div>
    <div id="answer"></div>
    <div id="meaning"></div>
  </div>
  <div class="row">
    <button id="listen" onclick="replay()" title="Éist arís">🔊</button>
    <button id="check" onclick="check()">Seiceáil ✓</button>
  </div>
  <div id="flash"></div>
</div>

<div id="over-screen" class="screen">
  <h1>Am istigh!</h1>
  <div id="final">0</div>
  <p style="color:#888">pointe · <span id="over-right">0</span> focal ceart</p>
  <div class="best" id="best-over"></div>
  <button class="big-btn" onclick="startGame()">Arís</button><button class="ghost-btn" onclick="show('start-screen')">Baile</button>
</div>

const GAME_MS = 60000, LS_KEY = '9u_best';
// Time per word scales with the word: 2.5 s + 0.5 s per vowel (each is a decision) + 0.1 s per letter, max 8 s
function timeFor(letters) { const v = letters.filter(ch => VOW_RE.test(ch)).length; return Math.min(8000, 2500 + 500 * v + 100 * letters.length); }
let wordMs = 4000;
const SEG_COLS = ['#e94560', '#e07b00', '#2a9d47', '#1b6e33'];   // +1 … +4, left to right
const FADA = { 'á':'a','é':'e','í':'i','ó':'o','ú':'u','Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U' };
const ADD  = { a:'á', e:'é', i:'í', o:'ó', u:'ú', A:'Á', E:'É', I:'Í', O:'Ó', U:'Ú' };
const VOW  = /[aeiouAEIOU]/;
const VOW_RE = /[aeiouAEIOU]/;

let score, right, gameLeft, wordStart, lastTick, raf, playing = false, locked = true;
let word = '', plain = [], picked = [], queue = [], flashT;
let best = 0; try { best = parseInt(localStorage.getItem(LS_KEY) || '0'); } catch (e) {}

// ── Audio ─────────────────────────────────────────────────────────────────────
let _ca = null, _pre = null, _preW = null;
function url(w) { return 'https://www.teanglann.ie/CanC/' + encodeURIComponent(w) + '.mp3'; }
function preload(w) { const a = new Audio(url(w)); a.onerror = function(){}; a.muted = true; a.play().catch(function(){}); _pre = a; _preW = w; }
function speak(w) {
  if (_ca) { _ca.pause(); _ca = null; }
  if (_pre && _preW === w) { const a = _pre; _pre = null; a.muted = false; a.currentTime = 0; a.play().catch(function(){}); _ca = a; return; }
  const a = new Audio(url(w)); a.onerror = function(){}; a.play().catch(function(){}); _ca = a;
}
function replay() { if (word && !locked) speak(word); }

// ── Helpers ───────────────────────────────────────────────────────────────────
function sh(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function show(id) { ['start-screen','game-screen','over-screen'].forEach(s => document.getElementById(s).style.display = s === id ? 'block' : 'none'); }
function fmtClock(ms) { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
// +4 / +3 / +2 / +1 for answering in the 1st / 2nd / 3rd / 4th quarter of this word's time
function points(el) { const q = wordMs / 4; if (el <= q) return 4; if (el <= 2 * q) return 3; if (el <= 3 * q) return 2; return 1; }

// ── Tiles ─────────────────────────────────────────────────────────────────────
function sizeTiles(n) {
  const box = document.getElementById('tiles'), w = box.clientWidth || 320, gap = n > 11 ? 3 : 5;
  box.style.setProperty('--gap', gap + 'px');
  box.style.setProperty('--tw', Math.max(18, Math.min(48, Math.floor((w - gap * (n - 1)) / n))) + 'px');
}
function drawTiles() {
  const box = document.getElementById('tiles');
  box.innerHTML = plain.map((ch, i) => {
    const v = VOW.test(ch), shown = picked[i] ? ADD[ch] : ch;
    return '<div class="tile ' + (v ? 'vow' : 'cons') + (picked[i] ? ' on' : '') + '"' + (v ? ' onclick="toggle(' + i + ')"' : '') + '>' + shown.toUpperCase() + '</div>';
  }).join('');
}
function toggle(i) { if (locked) return; picked[i] = !picked[i]; drawTiles(); }

// ── Game ──────────────────────────────────────────────────────────────────────
function startGame() {
  score = 0; right = 0; gameLeft = GAME_MS; queue = sh(POOL);
  document.getElementById('score').textContent = '0';
  document.getElementById('segs').innerHTML = SEG_COLS.map(c => '<div class="seg"><i style="background:' + c + '"></i></div>').join('');
  preload(queue[queue.length - 1][0]);          // unlock audio inside the tap (iPhone)
  show('game-screen'); playing = true; nextWord();
  lastTick = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
}
function nextWord() {
  if (queue.length === 0) queue = sh(POOL);
  const [w, m] = queue.pop();
  word = w; plain = [...w].map(ch => FADA[ch] || ch); picked = plain.map(() => false); wordMs = timeFor(plain);
  sizeTiles(plain.length); drawTiles();
  document.getElementById('answer').textContent = '';
  document.getElementById('meaning').textContent = m;
  document.getElementById('check').disabled = false; document.getElementById('listen').disabled = false;
  wordStart = performance.now(); locked = false;
  speak(w);
}
function tick(now) {
  if (!playing) return;
  const dt = now - lastTick; lastTick = now;
  if (!locked) {                                   // the 60 s only run while a word is live
    gameLeft -= dt;
    const el = now - wordStart, rem = wordMs - el, q = wordMs / 4;
    document.querySelectorAll('#segs .seg > i').forEach((f, i) => { f.style.width = (Math.max(0, Math.min(1, (rem - i * q) / q)) * 100) + '%'; });
    if (rem <= 0) finishWord(true);
  }
  const ck = document.getElementById('clock');
  ck.textContent = fmtClock(Math.max(0, gameLeft)); ck.className = gameLeft <= 10000 ? 'low' : '';
  document.getElementById('gbar').style.width = (Math.max(0, gameLeft) / GAME_MS * 100) + '%';
  if (gameLeft <= 0 && !locked) { endGame(); return; }
  raf = requestAnimationFrame(tick);
}
function check() { if (!locked && playing) finishWord(false); }
function finishWord(timeout) {
  locked = true;
  const el = performance.now() - wordStart;
  document.getElementById('check').disabled = true; document.getElementById('listen').disabled = true;
  if (!timeout && _pre === null) preload((queue[queue.length - 1] || POOL[0])[0]);   // keep iPhone audio unlocked
  const wantArr = [...word].map(ch => !!FADA[ch]);
  const ok = !timeout && wantArr.every((v, i) => v === picked[i]);
  const tiles = document.querySelectorAll('#tiles .tile');
  wantArr.forEach((want, i) => {
    if (want && picked[i]) tiles[i].classList.add('ok');
    else if (!want && picked[i]) tiles[i].classList.add('bad');
    else if (want && !picked[i]) { tiles[i].classList.add('miss'); tiles[i].textContent = word[i].toUpperCase(); }
  });
  document.getElementById('answer').textContent = word;
  const fl = document.getElementById('flash');
  // Partial credit: speed points × (right fadas − wrongly added fadas) ÷ fadas in the word, rounded down
  const nF = wantArr.filter(Boolean).length, rightF = wantArr.filter((v, i) => v && picked[i]).length, wrongF = wantArr.filter((v, i) => !v && picked[i]).length;
  const part = (!timeout && !ok) ? Math.max(0, Math.floor(points(el) * (rightF - wrongF) / nF)) : 0;
  if (ok) { const p = points(el); score += p; right++; playOk(); fl.textContent = '+' + p; fl.style.color = '#4caf50'; }
  else if (part > 0) { score += part; playOk(); fl.textContent = '+' + part + ' (' + rightF + '/' + nF + ')'; fl.style.color = '#e07b00'; }
  else { playNo(); fl.textContent = timeout ? 'Am caite' : '✗'; fl.style.color = '#e94560'; }
  document.getElementById('score').textContent = score;
  fl.style.opacity = '1'; clearTimeout(flashT); flashT = setTimeout(() => fl.style.opacity = '0', 700);
  setTimeout(() => { if (!playing) return; if (gameLeft <= 0) endGame(); else nextWord(); }, ok ? 900 : 1600);
}
function endGame() {
  playing = false; locked = true; cancelAnimationFrame(raf);
  if (_ca) { _ca.pause(); _ca = null; }
  const nb = score > best; if (nb) { best = score; try { localStorage.setItem(LS_KEY, best); } catch (e) {} }
  document.getElementById('final').textContent = score;
  document.getElementById('over-right').textContent = right;
  document.getElementById('best-over').textContent = nb ? '🏆 Taifead nua!' : 'Taifead: ' + best;
  show('over-screen');
}

document.addEventListener('keydown', e => {
  if (document.getElementById('game-screen').style.display === 'block' && e.key === 'Enter') { e.preventDefault(); check(); }
});
window.addEventListener('resize', () => { if (plain.length) sizeTiles(plain.length); });
document.getElementById('best-start').textContent = best ? 'Taifead: ' + best : '';
show('start-screen');

// ── Sound feedback ───────────────────────────────────────────────────────────
let _sfx=null;
function _gx(){if(!_sfx)_sfx=new(window.AudioContext||window.webkitAudioContext)();if(_sfx.state==='suspended')_sfx.resume();return _sfx;}
(function(){function w(){_gx();document.removeEventListener('touchstart',w);document.removeEventListener('mousedown',w);}document.addEventListener('touchstart',w,{passive:true});document.addEventListener('mousedown',w,{passive:true});})();
function _pt(f,d,t,g,dl){try{const c=_gx(),b=c.state==='running'?0:0.06,s=c.currentTime+b+dl,o=c.createOscillator(),gn=c.createGain();o.connect(gn);gn.connect(c.destination);o.type=t;o.frequency.setValueAtTime(f,s);gn.gain.setValueAtTime(g,s);gn.gain.exponentialRampToValueAtTime(0.0001,s+d);o.start(s);o.stop(s+d);}catch(e){}}
function playOk(){_pt(523,.15,'sine',.22,0);_pt(659,.2,'sine',.2,.12);}
function playNo(){_pt(220,.08,'sawtooth',.18,0);_pt(150,.18,'sawtooth',.14,.08);}
