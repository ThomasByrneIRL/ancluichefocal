<!DOCTYPE html>
<html lang="ga">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beirt Imreoirí</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f0; color: #1a1a2e;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .screen { display: none; flex-direction: column; align-items: center;
              justify-content: center; gap: 18px; text-align: center;
              width: 100%; max-width: 600px; padding: 24px; }
    .screen.active { display: flex; }

    h1 { font-size: 3rem; color: #53d8fb; letter-spacing: 2px; }
    h2 { font-size: 1.8rem; color: #53d8fb; }
    .subtitle { font-size: 1rem; color: #888; }

    /* ── Name entry ── */
    .name-inputs { width: 100%; display: flex; gap: 12px; }
    .name-field { flex: 1; display: flex; flex-direction: column; gap: 6px; text-align: left; }
    .name-field label { font-size: 0.85rem; color: #888; }
    .name-field input {
      width: 100%; padding: 10px 14px; border-radius: 8px;
      border: 2px solid #ddd; background: #fff; color: #1a1a2e;
      font-size: 1rem; outline: none; transition: border-color 0.15s;
    }
    .name-field input:focus { border-color: #53d8fb; }
    .start-btn {
      background: #e94560; color: #fff; border: none;
      border-radius: 10px; padding: 13px 36px;
      font-size: 1.05rem; font-weight: bold; cursor: pointer;
      transition: background 0.2s;
    }
    .start-btn:hover { background: #c73652; }
    .hint { font-size: 0.78rem; color: #444; }

    /* ── Player panels ── */
    #panels { width: 100%; display: flex; gap: 10px; }
    .panel {
      flex: 1; padding: 10px 14px; border-radius: 10px;
      border: 2px solid #ddd; background: #f0f4f8;
      transition: border-color 0.2s, background 0.2s;
      text-align: left;
    }
    /* Player colours */
    #panel-0 { border-color: #2e7d32; background: #edf7ed; }
    #panel-0.active-player { border-color: #2e7d32; background: #d4edda; }
    #panel-1 { border-color: #c62828; background: #fdf2f2; }
    #panel-1.active-player { border-color: #c62828; background: #f8d7da; }

    .p-header { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
    .p-name { font-size: 0.95rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-role { font-size: 0.72rem; color: #888; white-space: nowrap; }
    .p-score {
      font-size: 1.6rem; font-weight: bold; color: #1a1a2e;
      margin: 4px 0 2px;
    }
    .p-words { font-size: 0.78rem; color: #888; }

    /* ── Turn indicator ── */
    #turn-indicator {
      font-size: 1rem; font-weight: bold;
      letter-spacing: 1px; min-height: 1.4em;
    }

    /* ── Word timer ── */
    #word-timer-wrap { width: 100%; height: 5px; background: #ddd; border-radius: 3px; overflow: hidden; }
    #word-timer-bar  { height: 100%; border-radius: 3px; width: 100%; background: #2e7d32; }

    /* ── Word card ── */
    .card {
      background: #fff; border-radius: 14px; padding: 26px 24px;
      width: 100%; font-size: 1.9rem; font-weight: bold; color: #1a1a2e;
      letter-spacing: 1px; min-height: 88px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; cursor: pointer;
    }
    .card.flash-correct { background: #d4edda; }
    .card.flash-wrong   { background: #f8d7da; }
    .card.flash-timeout { background: #fff3cd; }
    .card.turn-card { background: #e8f0fe; font-size: 1.2rem; color: #1a6fb5; border: 2px solid #b3c8f0; }

    #sound-btn { font-size: 0.82rem; color: #444; cursor: pointer; user-select: none; }
    #sound-btn:hover { color: #888; }

    /* ── Choices ── */
    .choices { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .choice-btn {
      width: 100%; padding: 13px 18px; border-radius: 10px;
      border: 2px solid #ddd; background: #fff; color: #1a1a2e;
      font-size: 1rem; cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
      display: flex; align-items: center; gap: 12px;
    }
    .key-hint { font-size: 1rem; opacity: 0.45; flex-shrink: 0; width: 1.2em; text-align: center; }
    .btn-text  { flex: 1; text-align: left; }
    .choice-btn:hover:not(:disabled) { background: #fff5f6; border-color: #53d8fb; }
    .choice-btn.selected-correct { background: #d4edda; border-color: #2a9d47; color: #1a5c2e; }
    .choice-btn.selected-wrong   { background: #f8d7da; border-color: #e94560; color: #e94560; }
    .choice-btn.reveal-correct   { background: #d4edda; border-color: #4caf50; color: #4caf50; }

    #pts-flash {
      font-size: 1.3rem; font-weight: bold; color: #4caf50;
      opacity: 0; transition: opacity 0.25s; height: 28px;
    }

    /* ── Over screen ── */
    .result-icon { font-size: 3rem; }
    .final-sub { font-size: 0.95rem; color: #888; }
    .player-result {
      width: 100%; padding: 12px 16px; border-radius: 10px;
      background: #fff; text-align: left; font-size: 0.95rem;
    }
    .player-result.winner { border: 2px solid #ffc107; }
    .player-result .pr-name { font-weight: bold; font-size: 1.05rem; }
    .player-result .pr-detail { color: #888; font-size: 0.85rem; margin-top: 3px; }
    .btn-row { display: flex; gap: 10px; }
    .btn-secondary {
      background: #fff; color: #1a1a2e; border: none;
      border-radius: 10px; padding: 12px 28px;
      font-size: 1rem; cursor: pointer; font-weight: bold;
      transition: background 0.2s;
    }
    .btn-secondary:hover { background: #fff5f6; }
  </style>
</head>
<body>

<!-- ══ START SCREEN ═══════════════════════════════════════════════════════════ -->
<div id="start-screen" class="screen active">
  <h1>Beirt Imreoirí</h1>
  <p class="subtitle">Cainteoir Nua vs Gaeilgeoir</p>
  <div class="name-inputs">
    <div class="name-field">
      <label>Imreoir 1 – Cainteoir Nua</label>
      <input type="text" id="name1" placeholder="Ainm..." maxlength="16" autocomplete="off">
    </div>
    <div class="name-field">
      <label>Imreoir 2 – Gaeilgeoir</label>
      <input type="text" id="name2" placeholder="Ainm..." maxlength="16" autocomplete="off">
    </div>
  </div>
  <button class="start-btn" onclick="startGame()">Tosaigh</button>
  <p class="hint">Cainteoir Nua: 6 soicind · +2 pointe · Gaeilgeoir: 3 soicind · +1 pointe · 15 focal an duine</p>
</div>

<!-- ══ GAME SCREEN ════════════════════════════════════════════════════════════ -->
<div id="game-screen" class="screen">
  <div id="panels">
    <div class="panel" id="panel-0">
      <div class="p-header">
        <div class="p-name" id="p-name-0">Imreoir 1</div>
        <div class="p-role">Cainteoir Nua</div>
      </div>
      <div class="p-score" id="p-score-0">0</div>
      <div class="p-words" id="p-words-0">15 focal fágtha</div>
    </div>
    <div class="panel" id="panel-1">
      <div class="p-header">
        <div class="p-name" id="p-name-1">Imreoir 2</div>
        <div class="p-role">Gaeilgeoir</div>
      </div>
      <div class="p-score" id="p-score-1">0</div>
      <div class="p-words" id="p-words-1">15 focal fágtha</div>
    </div>
  </div>

  <div id="turn-indicator">—</div>

  <div id="word-timer-wrap"><div id="word-timer-bar"></div></div>
  <div id="word-card" class="card">—</div>
  <div id="sound-btn" onclick="replayPron()">🔊 arís</div>

  <div class="choices">
    <button class="choice-btn" id="choice-a" onclick="pick(0)"><span class="key-hint">↑</span><span class="btn-text"></span></button>
    <button class="choice-btn" id="choice-b" onclick="pick(1)"><span class="key-hint">↓</span><span class="btn-text"></span></button>
  </div>
  <div id="pts-flash">+2</div>
</div>

<!-- ══ OVER SCREEN ════════════════════════════════════════════════════════════ -->
<div id="over-screen" class="screen">
  <div class="result-icon">🏆</div>
  <h2 id="over-title">Buaiteoir!</h2>
  <p class="final-sub" id="over-sub"></p>
  <div id="result-0" class="player-result"></div>
  <div id="result-1" class="player-result"></div>
  <div class="btn-row">
    <button class="start-btn" onclick="rematch()">Arís</button>
    <button class="btn-secondary" onclick="showStart()">Baile</button>
  </div>
</div>

<script src="focloir.js"></script>
<script>

const WORDS      = Object.keys(DICT);
const ROLES      = ['Cainteoir Nua', 'Gaeilgeoir'];
const WORD_MS    = [6000, 3000];   // per player
const PTS        = [2, 1];         // per player
const WORDS_EACH = 15;

const PALETTE = [
  { border: '#2e7d32', bar: '#2e7d32', tiColor: '#2e7d32' },
  { border: '#c62828', bar: '#c62828', tiColor: '#c62828' },
];

let players = [];
let currentPlayer = 0;
let wordEnd;
let wordRAF;
let correctIdx = 0, locked = false;
let flashTimer;
let _ca = null, _currentWord = '';
let _nextAudio = null, _nextW = null;

// ── Screens ───────────────────────────────────────────────────────────────────
function show(id) {
  ['start-screen','game-screen','over-screen'].forEach(s =>
    document.getElementById(s).classList.toggle('active', s === id));
}
function showStart() { show('start-screen'); }

// ── Init ──────────────────────────────────────────────────────────────────────
function initPlayers(n1, n2) {
  players = [
    { name: n1 || 'Imreoir 1', score: 0, correct: 0, wordsLeft: WORDS_EACH },
    { name: n2 || 'Imreoir 2', score: 0, correct: 0, wordsLeft: WORDS_EACH },
  ];
}

function startGame() {
  const n1 = document.getElementById('name1').value.trim();
  const n2 = document.getElementById('name2').value.trim();
  initPlayers(n1, n2);
  currentPlayer = 0;
  locked = false;
  updatePanels();
  show('game-screen');
  beginTurn();
}

function rematch() {
  players.forEach(p => { p.score = 0; p.correct = 0; p.wordsLeft = WORDS_EACH; });
  currentPlayer = 0;
  locked = false;
  updatePanels();
  show('game-screen');
  beginTurn();
}

// ── Panel updates ─────────────────────────────────────────────────────────────
function updatePanels() {
  players.forEach((p, i) => {
    document.getElementById('p-name-' + i).textContent = p.name.toUpperCase();
    document.getElementById('p-score-' + i).textContent = p.score;
    const wl = p.wordsLeft;
    document.getElementById('p-words-' + i).textContent =
      wl === 0 ? 'críochnaithe' : wl + ' focal fágtha';
    document.getElementById('panel-' + i).classList.toggle('active-player', i === currentPlayer);
  });
  const ti = document.getElementById('turn-indicator');
  ti.textContent = players[currentPlayer].name.toUpperCase() + '!';
  ti.style.color = PALETTE[currentPlayer].tiColor;
}

// ── Audio ─────────────────────────────────────────────────────────────────────
function playWord(word) {
  if (_ca) { _ca.pause(); _ca = null; }
  const a = new Audio('https://www.teanglann.ie/CanC/' + encodeURIComponent(word) + '.mp3');
  a.onerror = function(){};
  a.play().catch(function(){});
  _ca = a;
}
function replayPron() { if (_currentWord) playWord(_currentWord); }

function preloadNext() {
  _nextW = WORDS[Math.floor(Math.random() * WORDS.length)];
  if (_ca) { _ca.pause(); _ca = null; }
  _nextAudio = new Audio('https://www.teanglann.ie/CanC/' + encodeURIComponent(_nextW) + '.mp3');
  _nextAudio.onerror = function(){};
  _nextAudio.muted = true; // unlock iOS without audible bleed during transition
  _nextAudio.play().catch(function(){});
  _ca = _nextAudio;
}

// ── Word helpers ──────────────────────────────────────────────────────────────
function sh(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function rnd(exclude) {
  let w;
  do { w = WORDS[Math.floor(Math.random()*WORDS.length)]; } while (w === exclude);
  return w;
}

// ── Next active player ────────────────────────────────────────────────────────
function nextPlayer() {
  const other = 1 - currentPlayer;
  if (players[other].wordsLeft > 0) return other;
  if (players[currentPlayer].wordsLeft > 0) return currentPlayer;
  return -1; // both done
}

// ── Turn flow ─────────────────────────────────────────────────────────────────
function beginTurn() {
  locked = true;
  cancelAnimationFrame(wordRAF);
  const name = players[currentPlayer].name.toUpperCase();
  const role = ROLES[currentPlayer];
  document.getElementById('word-card').textContent = name + ' — do sheal!';
  document.getElementById('word-card').className = 'card turn-card';
  document.getElementById('word-timer-bar').style.width = '100%';
  const btns = [document.getElementById('choice-a'), document.getElementById('choice-b')];
  btns.forEach(b => { b.querySelector('.btn-text').textContent = ''; b.disabled = true; });
  document.getElementById('pts-flash').style.opacity = '0';
  updatePanels();
  setTimeout(() => { locked = false; nextWord(); }, 1500);
}

function nextWord() {
  if (locked) return;

  let word;
  if (_nextW && _nextAudio) {
    word = _nextW;
    _nextW = null;
    const a = _nextAudio; _nextAudio = null;
    a.muted = false;
    a.currentTime = 0;
    a.play().catch(function(){});
    _ca = a;
  } else {
    word = WORDS[Math.floor(Math.random()*WORDS.length)];
    playWord(word);
  }

  const correct = DICT[word][0];
  const wrong   = DICT[rnd(word)][0];
  const opts    = sh([correct, wrong]);
  correctIdx    = opts.indexOf(correct);
  _currentWord  = word;

  document.getElementById('word-card').textContent = word;
  document.getElementById('word-card').className   = 'card';

  const btns = [document.getElementById('choice-a'), document.getElementById('choice-b')];
  btns.forEach((b, i) => {
    b.querySelector('.btn-text').textContent = opts[i];
    b.className = 'choice-btn';
    b.disabled  = false;
  });

  cancelAnimationFrame(wordRAF);
  wordEnd = Date.now() + WORD_MS[currentPlayer];
  tickWord();
}

function tickWord() {
  const rem = wordEnd - Date.now();
  const wms = WORD_MS[currentPlayer];
  if (rem <= 0) {
    document.getElementById('word-timer-bar').style.width = '0%';
    playNo();
    document.getElementById('word-card').className = 'card flash-timeout';
    const btns = [document.getElementById('choice-a'), document.getElementById('choice-b')];
    btns.forEach(b => b.disabled = true);
    btns[correctIdx].className = 'choice-btn reveal-correct';
    locked = true;
    players[currentPlayer].wordsLeft--;
    updatePanels();
    const np = nextPlayer();
    if (np === -1) { setTimeout(endGame, 700); return; }
    currentPlayer = np;
    setTimeout(beginTurn, 1000);
    return;
  }
  const pct = (rem / wms) * 100;
  const bar = document.getElementById('word-timer-bar');
  bar.style.width = pct + '%';
  bar.style.background = PALETTE[currentPlayer].bar;
  wordRAF = requestAnimationFrame(tickWord);
}

// ── Pick ──────────────────────────────────────────────────────────────────────
function pick(idx) {
  if (locked) return;
  locked = true;
  cancelAnimationFrame(wordRAF);

  const btns = [document.getElementById('choice-a'), document.getElementById('choice-b')];
  btns.forEach(b => b.disabled = true);

  if (idx === correctIdx) {
    const pts = PTS[currentPlayer];
    players[currentPlayer].score += pts;
    players[currentPlayer].correct++;
    players[currentPlayer].wordsLeft--;
    playOk();
    btns[idx].className = 'choice-btn selected-correct';
    document.getElementById('word-card').className = 'card flash-correct';
    showFlash('+' + pts);
    updatePanels();
    const np = nextPlayer();
    if (np === -1) {
      setTimeout(endGame, 850);
    } else {
      preloadNext();
      currentPlayer = np;
      setTimeout(beginTurn, 1000);
    }
  } else {
    players[currentPlayer].wordsLeft--;
    playNo();
    btns[idx].className = 'choice-btn selected-wrong';
    btns[correctIdx].className = 'choice-btn reveal-correct';
    document.getElementById('word-card').className = 'card flash-wrong';
    updatePanels();
    const np = nextPlayer();
    if (np === -1) {
      setTimeout(endGame, 800);
    } else {
      preloadNext();
      currentPlayer = np;
      setTimeout(beginTurn, 1000);
    }
  }
}

function showFlash(txt) {
  const el = document.getElementById('pts-flash');
  el.textContent = txt;
  el.style.opacity = '1';
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { el.style.opacity = '0'; }, 800);
}

// ── End game ──────────────────────────────────────────────────────────────────
function endGame() {
  cancelAnimationFrame(wordRAF);
  locked = true;
  if (_ca) { _ca.pause(); _ca = null; }

  const s0 = players[0].score, s1 = players[1].score;
  let winner = -1;
  if (s0 > s1) winner = 0;
  else if (s1 > s0) winner = 1;

  if (winner >= 0) {
    document.getElementById('over-title').textContent = players[winner].name.toUpperCase() + ' buaite! 🏆';
  } else {
    document.getElementById('over-title').textContent = 'Comhscór! 🤝';
  }
  document.getElementById('over-sub').textContent = '';

  [0, 1].forEach(i => {
    const p   = players[i];
    const el  = document.getElementById('result-' + i);
    el.className = 'player-result' + (i === winner ? ' winner' : '');
    el.innerHTML =
      '<div class="pr-name">' + p.name.toUpperCase() +
        ' <span style="font-weight:normal;font-size:0.85em;color:#888;">' + ROLES[i] + '</span>' +
        (i === winner ? ' 🏆' : '') + '</div>' +
      '<div class="pr-detail">Scór: ' + p.score + ' · Ceart: ' + p.correct + '/' + WORDS_EACH + '</div>';
  });

  show('over-screen');
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const inInput = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (e.key === 'ArrowUp') { e.preventDefault(); pick(0); }
  if (e.key === 'ArrowDown') { e.preventDefault(); pick(1); }
  if (e.key === 'Enter') {
    if (document.getElementById('start-screen').classList.contains('active')) startGame();
  }
});

show('start-screen');

// ── Sound feedback ───────────────────────────────────────────────────────────
let _sfx=null;
function _gx(){if(!_sfx)_sfx=new(window.AudioContext||window.webkitAudioContext)();if(_sfx.state==='suspended')_sfx.resume();return _sfx;}
// iPhone: switch sound on at the very first tap anywhere on the page
(function(){function w(){_gx();document.removeEventListener('touchstart',w);document.removeEventListener('mousedown',w);}document.addEventListener('touchstart',w,{passive:true});document.addEventListener('mousedown',w,{passive:true});})();
function _pt(f,d,t,g,dl){try{const c=_gx(),b=c.state==='running'?0:0.06,s=c.currentTime+b+dl,o=c.createOscillator(),gn=c.createGain();o.connect(gn);gn.connect(c.destination);o.type=t;o.frequency.setValueAtTime(f,s);gn.gain.setValueAtTime(g,s);gn.gain.exponentialRampToValueAtTime(0.0001,s+d);o.start(s);o.stop(s+d);}catch(e){}}
function playOk(){_pt(523,.15,'sine',.22,0);_pt(659,.2,'sine',.2,.12);}
function playNo(){_pt(220,.08,'sawtooth',.18,0);_pt(150,.18,'sawtooth',.14,.08);}
</script>
</body>
</html>
