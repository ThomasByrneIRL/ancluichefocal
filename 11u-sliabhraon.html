<!DOCTYPE html>
<html lang="ga">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliabhraon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f0;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .screen { display: none; flex-direction: column; align-items: center;
              justify-content: center; gap: 18px; text-align: center;
              width: 100%; max-width: 540px; padding: 24px; }
    .screen.active { display: flex; }

    h1 { font-size: 3.2rem; color: #53d8fb; letter-spacing: 2px; }
    h2 { font-size: 2rem; color: #53d8fb; }
    .subtitle { font-size: 1.1rem; color: #888; }

    .level-cards { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .level-card {
      width: 100%; padding: 14px 20px; border-radius: 12px;
      border: 2px solid #ddd; background: #fff; color: #1a1a2e;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
      display: flex; align-items: center; justify-content: space-between;
    }
    .level-card:hover { background: #fff5f6; border-color: #53d8fb; }
    .level-card.locked { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
    .level-card .lc-left { text-align: left; }
    .level-card .lc-name { font-size: 1.05rem; font-weight: bold; }
    .level-card .lc-info { font-size: 0.8rem; color: #888; margin-top: 2px; }
    .level-card .lc-best { font-size: 0.85rem; color: #ffc107; }
    .level-card .lc-lock { font-size: 1.2rem; opacity: 0.5; }

    #game-screen { gap: 14px; }
    #hud { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; }
    #level-badge { font-size: 0.8rem; color: #53d8fb; border: 1px solid #0f3460; border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
    #timer-display { font-size: 2.2rem; font-weight: bold; color: #53d8fb; font-variant-numeric: tabular-nums; letter-spacing: 2px; min-width: 72px; }
    #timer-display.warning { color: #ffc107; }
    #timer-display.danger  { color: #e94560; }
    #score-wrap { display: flex; flex-direction: column; align-items: center; }
    #score-display { font-size: 2.2rem; font-weight: bold; color: #4caf50; min-width: 50px; line-height: 1; }
    #score-label { font-size: 0.75rem; color: #888; }
    #lives-display { font-size: 1.3rem; letter-spacing: 3px; }
    .life-full { color: #e94560; }
    .life-lost { color: #2a2a45; }
    .life-inf  { color: #e94560; font-size: 1.5rem; letter-spacing: 0; }

    .card {
      background: #fff; border-radius: 14px; padding: 26px 24px;
      width: 100%; font-size: 1.9rem; font-weight: bold; color: #1a1a2e;
      letter-spacing: 1px; min-height: 88px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; cursor: pointer;
    }
    .card.flash-correct { background: #d4edda; }
    .card.flash-wrong   { background: #f8d7da; }
    .card.flash-timeout { background: #fff3cd; }

    #word-timer-wrap { width: 100%; height: 5px; background: #ddd; border-radius: 3px; overflow: hidden; }
    #word-timer-bar  { height: 100%; background: #53d8fb; border-radius: 3px; width: 100%; }
    #word-timer-bar.urgent { background: #e94560; }

    #sound-btn { font-size: 0.82rem; color: #444; cursor: pointer; user-select: none; }
    #sound-btn:hover { color: #888; }

    .choices { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .choice-btn {
      width: 100%; padding: 13px 18px; border-radius: 10px;
      border: 2px solid #ddd; background: #fff; color: #1a1a2e;
      font-size: 1rem; cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
      display: flex; align-items: center; gap: 12px;
    }
    .key-hint { font-size: 1rem; opacity: 0.45; flex-shrink: 0; width: 1.2em; text-align: center; }
    .btn-text  { flex: 1; text-align: left; }
    .choice-btn:hover:not(:disabled) { background: #fff5f6; border-color: #53d8fb; }
    .choice-btn.selected-correct { background: #d4edda; border-color: #2a9d47; color: #1a5c2e; }
    .choice-btn.selected-wrong   { background: #f8d7da; border-color: #e94560; color: #e94560; }
    .choice-btn.reveal-correct   { background: #d4edda; border-color: #4caf50; color: #4caf50; }

    #pts-flash { font-size: 1.3rem; font-weight: bold; color: #4caf50; opacity: 0; transition: opacity 0.3s; height: 28px; }

    .result-icon { font-size: 3rem; line-height: 1; }
    .final-score-num { font-size: 5rem; font-weight: bold; color: #53d8fb; line-height: 1; }
    .final-sub  { font-size: 1rem; color: #888; }
    .best-note  { font-size: 1rem; color: #ffc107; }

    .btn-primary, .btn-secondary {
      border: none; border-radius: 10px; padding: 13px 32px;
      font-size: 1.05rem; cursor: pointer; font-weight: bold; transition: background 0.2s;
    }
    .btn-primary   { background: #e94560; color: #fff; }
    .btn-primary:hover   { background: #c73652; }
    .btn-secondary { background: #fff; color: #1a1a2e; }
    .btn-secondary:hover { background: #fff5f6; }

    .hint { font-size: 0.78rem; color: #444; margin-top: 4px; }
  </style>
</head>
<body>

<!-- ══ START SCREEN ═══════════════════════════════════════════════════════════ -->
<div id="start-screen" class="screen active">
  <h1>Sliabhraon</h1>
  <p class="subtitle">Roghnaigh leibhéal</p>
  <div class="level-cards" id="level-cards"></div>
  <p class="hint">↑ ↓ nó W / S a úsáid le linn an chluiche</p>
</div>

<!-- ══ GAME SCREEN ════════════════════════════════════════════════════════════ -->
<div id="game-screen" class="screen">
  <div id="hud">
    <div id="level-badge">L1</div>
    <div id="timer-display">0:30</div>
    <div id="score-wrap">
      <div id="score-display">0</div>
      <div id="score-label">ceart</div>
    </div>
    <div id="lives-display"></div>
  </div>

  <div id="word-timer-wrap"><div id="word-timer-bar"></div></div>
  <div id="word-card" class="card" onclick="replayPron()">—</div>
  <div id="sound-btn" onclick="replayPron()">🔊 arís</div>

  <div class="choices">
    <button class="choice-btn" id="choice-a" onclick="pick(0)"><span class="key-hint">↑</span><span class="btn-text"></span></button>
    <button class="choice-btn" id="choice-b" onclick="pick(1)"><span class="key-hint">↓</span><span class="btn-text"></span></button>
  </div>
  <div id="pts-flash">+1</div>
</div>

<!-- ══ OVER / COMPLETE SCREEN ════════════════════════════════════════════════ -->
<div id="over-screen" class="screen">
  <div class="result-icon" id="over-icon"></div>
  <h2 id="over-title"></h2>
  <div class="final-score-num" id="final-score-num">0</div>
  <p class="final-sub">focal ceart</p>
  <p class="best-note" id="over-best"></p>
  <button class="btn-primary"   id="btn-next"  onclick="goNext()"       style="display:none">Ar aghaidh →</button>
  <button class="btn-secondary" id="btn-retry" onclick="startLevel(0)"  style="display:none">Arís</button>
  <button class="btn-secondary" id="btn-menu"  onclick="showMenu()">Roghchlár</button>
</div>

<script src="focloir.js"></script>
<script>

// ── Level config ──────────────────────────────────────────────────────────────
const LEVELS = [
  { num: 1, lives: Infinity, gameMs: 30000, wordMs: 5000, label: 'Leibhéal 1', info: '∞ saol · 30 soic' },
  { num: 2, lives: 3,        gameMs: 30000, wordMs: 5000, label: 'Leibhéal 2', info: '3 shaol · 30 soic' },
  { num: 3, lives: 2,        gameMs: 45000, wordMs: 5000, label: 'Leibhéal 3', info: '2 shaol · 45 soic' },
  { num: 4, lives: 1,        gameMs: 60000, wordMs: 5000, label: 'Leibhéal 4', info: '1 shaol · 60 soic' },
  { num: 5, lives: 1,        gameMs: 60000, wordMs: 2500, label: 'Leibhéal 5', info: '1 shaol · 60 soic · 2.5 soic an focal' },
];
const WORDS = Object.keys(DICT);

// ── Persistent state ──────────────────────────────────────────────────────────
let bestScores = [0, 0, 0, 0, 0];
function loadStorage() {
  try { for (let i = 0; i < 5; i++) bestScores[i] = parseInt(localStorage.getItem('11u_best_' + (i+1)) || '0'); } catch(e){}
}
function saveBest(lvlIdx, s) {
  if (s > bestScores[lvlIdx]) {
    bestScores[lvlIdx] = s;
    try { localStorage.setItem('11u_best_' + (lvlIdx+1), s); } catch(e){}
  }
}
loadStorage();

// ── Runtime state ─────────────────────────────────────────────────────────────
let currentLevel = 0;
let score = 0, lives = Infinity;
let gameEnd, wordEnd;
let gameRAF, wordRAF;
let correctIdx = 0, locked = false;
let flashTimer;
let _ca = null, _currentWord = '';

// ── Screens ───────────────────────────────────────────────────────────────────
function show(id) {
  ['start-screen','game-screen','over-screen'].forEach(s =>
    document.getElementById(s).classList.toggle('active', s === id));
}

// ── Start screen ──────────────────────────────────────────────────────────────
function buildMenu() {
  const wrap = document.getElementById('level-cards');
  wrap.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const locked = i > 0;
    const best   = bestScores[i];
    const card   = document.createElement('div');
    card.className = 'level-card' + (locked ? ' locked' : '');
    card.innerHTML =
      '<div class="lc-left">' +
        '<div class="lc-name">' + lv.label + '</div>' +
        '<div class="lc-info">' + lv.info + '</div>' +
        (best > 0 ? '<div class="lc-best">Is fearr: ' + best + ' focal</div>' : '') +
      '</div>' +
      '<div class="lc-lock">' + (locked ? '🔒' : '') + '</div>';
    if (!locked) card.onclick = () => startLevel(i);
    wrap.appendChild(card);
  });
}

function showMenu() { buildMenu(); show('start-screen'); }

// ── Audio ─────────────────────────────────────────────────────────────────────
function playPron(word) {
  if (_ca) { _ca.pause(); _ca = null; }
  const a = new Audio('https://www.teanglann.ie/CanC/' + encodeURIComponent(word) + '.mp3');
  a.onerror = function(){};
  a.play().catch(function(){});
  _ca = a;
}
function replayPron() { if (_currentWord) playPron(_currentWord); }

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}
function sh(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function rnd(exclude) {
  let w;
  do { w = WORDS[Math.floor(Math.random()*WORDS.length)]; } while (w === exclude);
  return w;
}

function updateLives() {
  const lv = LEVELS[currentLevel];
  let h = '';
  if (lv.lives === Infinity) {
    h = '<span class="life-inf">∞</span>';
  } else {
    for (let i = 0; i < lv.lives; i++)
      h += '<span class="' + (i < lives ? 'life-full' : 'life-lost') + '">♥</span>';
  }
  document.getElementById('lives-display').innerHTML = h;
}

// ── Start a level ─────────────────────────────────────────────────────────────
function startLevel(lvlIdx) {
  currentLevel = lvlIdx;
  const lv = LEVELS[lvlIdx];
  score  = 0;
  lives  = lv.lives;
  locked = false;

  cancelAnimationFrame(gameRAF);
  cancelAnimationFrame(wordRAF);

  gameEnd = Date.now() + lv.gameMs;

  document.getElementById('level-badge').textContent = 'L' + lv.num;
  document.getElementById('timer-display').textContent = fmt(lv.gameMs);
  document.getElementById('timer-display').className = '';
  document.getElementById('score-display').textContent = '0';
  document.getElementById('pts-flash').style.opacity = '0';
  updateLives();

  show('game-screen');
  nextWord();
  tickGame();
}

// ── Word loop ─────────────────────────────────────────────────────────────────
function nextWord() {
  if (locked) return;
  const word    = WORDS[Math.floor(Math.random()*WORDS.length)];
  const correct = DICT[word][0];
  const wrong   = DICT[rnd(word)][0];
  const opts    = sh([correct, wrong]);
  correctIdx    = opts.indexOf(correct);
  _currentWord  = word;

  document.getElementById('word-card').textContent = word;
  document.getElementById('word-card').className = 'card';

  const btns = [document.getElementById('choice-a'), document.getElementById('choice-b')];
  btns.forEach((b, i) => {
    b.querySelector('.btn-text').textContent = opts[i];
    b.className = 'choice-btn';
    b.disabled  = false;
  });

  playPron(word);

  cancelAnimationFrame(wordRAF);
  wordEnd = Date.now() + LEVELS[currentLevel].wordMs;
  tickWord();
}

function tickWord() {
  const rem = wordEnd - Date.now();
  if (rem <= 0) {
    document.getElementById('word-timer-bar').style.width = '0%';
    document.getElementById('word-timer-bar').className = 'urgent';
    playNo();
    document.getElementById('word-card').className = 'card flash-timeout';
    const btns = [document.getElementById('choice-a'), document.getElementById('choice-b')];
    btns.forEach(b => b.disabled = true);
    locked = true;
    if (LEVELS[currentLevel].lives !== Infinity) {
      lives--;
      updateLives();
      if (lives <= 0) { setTimeout(() => endGame(false), 500); return; }
    }
    setTimeout(() => { locked = false; nextWord(); }, 500);
    return;
  }
  const wordMs = LEVELS[currentLevel].wordMs;
  const pct = (rem / wordMs) * 100;
  const bar = document.getElementById('word-timer-bar');
  bar.style.width = pct + '%';
  bar.className   = rem <= Math.min(1500, wordMs * 0.4) ? 'urgent' : '';
  wordRAF = requestAnimationFrame(tickWord);
}

// ── Game clock ────────────────────────────────────────────────────────────────
function tickGame() {
  const rem = gameEnd - Date.now();
  if (rem <= 0) {
    document.getElementById('timer-display').textContent = '0:00';
    endGame(true);
    return;
  }
  const td = document.getElementById('timer-display');
  td.textContent = fmt(rem);
  const lv = LEVELS[currentLevel];
  if      (rem <= lv.gameMs * 0.17) td.className = 'danger';
  else if (rem <= lv.gameMs * 0.34) td.className = 'warning';
  else                               td.className = '';
  gameRAF = requestAnimationFrame(tickGame);
}

// ── Pick ──────────────────────────────────────────────────────────────────────
function pick(idx) {
  if (locked) return;
  if (gameEnd - Date.now() <= 0) return;
  locked = true;
  cancelAnimationFrame(wordRAF);

  const btns = [document.getElementById('choice-a'), document.getElementById('choice-b')];
  btns.forEach(b => b.disabled = true);

  if (idx === correctIdx) {
    score++;
    document.getElementById('score-display').textContent = score;
    showFlash('+1');
    playOk();
    btns[idx].className = 'choice-btn selected-correct';
    document.getElementById('word-card').className = 'card flash-correct';
    setTimeout(() => { locked = false; nextWord(); }, 340);
  } else {
    const infinite = LEVELS[currentLevel].lives === Infinity;
    if (!infinite) { lives--; updateLives(); }
    playNo();
    btns[idx].className = 'choice-btn selected-wrong';
    btns[correctIdx].className = 'choice-btn reveal-correct';
    document.getElementById('word-card').className = 'card flash-wrong';
    if (!infinite && lives <= 0) {
      setTimeout(() => endGame(false), 550);
    } else {
      setTimeout(() => { locked = false; nextWord(); }, 380);
    }
  }
}

function showFlash(txt) {
  const el = document.getElementById('pts-flash');
  el.textContent = txt;
  el.style.opacity = '1';
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { el.style.opacity = '0'; }, 550);
}

// ── End game ──────────────────────────────────────────────────────────────────
function endGame(survived) {
  cancelAnimationFrame(gameRAF);
  cancelAnimationFrame(wordRAF);
  locked = true;
  if (_ca) { _ca.pause(); _ca = null; }

  saveBest(currentLevel, score);
  const isNewBest = score >= bestScores[currentLevel] && score > 0;

  const nextBtn  = document.getElementById('btn-next');
  const retryBtn = document.getElementById('btn-retry');

  if (survived && currentLevel < LEVELS.length - 1) {
    document.getElementById('over-icon').textContent  = '🏆';
    document.getElementById('over-title').textContent = LEVELS[currentLevel].label + ' críochnaithe!';
    nextBtn.style.display  = 'inline-block';
    retryBtn.style.display = 'none';
  } else if (survived && currentLevel === LEVELS.length - 1) {
    document.getElementById('over-icon').textContent  = '🏆';
    document.getElementById('over-title').textContent = 'Comhghairdeas!';
    nextBtn.style.display  = 'none';
    retryBtn.style.display = 'inline-block';
    retryBtn.textContent   = 'Arís ó thús';
  } else {
    document.getElementById('over-icon').textContent  = '💀';
    document.getElementById('over-title').textContent = 'Saol Amach!';
    nextBtn.style.display  = 'none';
    retryBtn.style.display = 'inline-block';
    retryBtn.textContent   = currentLevel === 0 ? 'Arís' : 'Arís ó Leibhéal 1';
  }

  document.getElementById('final-score-num').textContent = score;
  document.getElementById('over-best').textContent = isNewBest
    ? '★ Scór is fearr nua!'
    : (bestScores[currentLevel] > 0 ? 'Is fearr: ' + bestScores[currentLevel] + ' focal' : '');

  show('over-screen');
}

function goNext() { startLevel(currentLevel + 1); }

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp'   || e.key === 'w' || e.key === 'W') { e.preventDefault(); pick(0); }
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault(); pick(1); }
  if (e.key === 'Enter') {
    const nextBtn = document.getElementById('btn-next');
    if (nextBtn.style.display !== 'none' && document.getElementById('over-screen').classList.contains('active')) {
      e.preventDefault(); goNext();
    }
  }
});

// ── Init ──────────────────────────────────────────────────────────────────────
buildMenu();
show('start-screen');

// ── Sound feedback ───────────────────────────────────────────────────────────
let _sfx=null;
function _gx(){if(!_sfx)_sfx=new(window.AudioContext||window.webkitAudioContext)();if(_sfx.state==='suspended')_sfx.resume();return _sfx;}
// iPhone: switch sound on at the very first tap anywhere on the page
(function(){function w(){_gx();document.removeEventListener('touchstart',w);document.removeEventListener('mousedown',w);}document.addEventListener('touchstart',w,{passive:true});document.addEventListener('mousedown',w,{passive:true});})();
function _pt(f,d,t,g,dl){try{const c=_gx(),b=c.state==='running'?0:0.06,s=c.currentTime+b+dl,o=c.createOscillator(),gn=c.createGain();o.connect(gn);gn.connect(c.destination);o.type=t;o.frequency.setValueAtTime(f,s);gn.gain.setValueAtTime(g,s);gn.gain.exponentialRampToValueAtTime(0.0001,s+d);o.start(s);o.stop(s+d);}catch(e){}}
function playOk(){_pt(523,.15,'sine',.22,0);_pt(659,.2,'sine',.2,.12);}
function playNo(){_pt(220,.08,'sawtooth',.18,0);_pt(150,.18,'sawtooth',.14,.08);}
</script>
</body>
</html>
