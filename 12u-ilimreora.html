<!DOCTYPE html>
<html lang="ga">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12ú – Ilimreora</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f0; color: #1a1a2e;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .screen { display: none; flex-direction: column; align-items: center;
              justify-content: center; gap: 14px; text-align: center;
              width: 100%; max-width: 720px; padding: 24px; }
    .screen.active { display: flex; }

    h1 { font-size: 3rem; color: #53d8fb; letter-spacing: 2px; }
    h2 { font-size: 1.8rem; color: #53d8fb; }
    .subtitle { font-size: 1rem; color: #888; }

    /* ── Player count selector ── */
    .count-row {
      display: flex; align-items: center; gap: 16px;
      background: #fff; border-radius: 12px; padding: 10px 20px;
    }
    .count-btn {
      background: none; border: 2px solid #53d8fb; color: #53d8fb;
      border-radius: 8px; width: 36px; height: 36px; font-size: 1.3rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .count-btn:hover { background: #fff5f6; }
    .count-btn:disabled { border-color: #333; color: #333; cursor: default; }
    #n-display { font-size: 1.1rem; font-weight: bold; color: #1a1a2e; min-width: 120px; }

    /* ── Name grid ── */
    #name-grid {
      width: 100%; display: grid; gap: 10px;
    }
    .name-field { display: flex; flex-direction: column; gap: 5px; text-align: left; }
    .name-field label { font-size: 0.82rem; }
    .name-field input {
      width: 100%; padding: 9px 13px; border-radius: 8px;
      border: 2px solid #ddd; background: #fff; color: #1a1a2e;
      font-size: 0.95rem; outline: none; transition: border-color 0.15s;
    }
    .name-field input:focus { border-color: #53d8fb; }
    .start-btn {
      background: #e94560; color: #fff; border: none;
      border-radius: 10px; padding: 12px 36px;
      font-size: 1.05rem; font-weight: bold; cursor: pointer;
      transition: background 0.2s;
    }
    .start-btn:hover { background: #c73652; }
    .hint { font-size: 0.78rem; color: #444; }

    /* ── Player panels ── */
    #panels {
      width: 100%; display: grid; gap: 8px;
    }
    .panel {
      padding: 9px 13px; border-radius: 10px;
      border: 2px solid #ddd; background: #f0f4f8;
      transition: border-color 0.2s, background 0.2s, opacity 0.2s;
      text-align: left;
    }
    .panel.dead { opacity: 0.3; }
    .p-name { font-size: 0.9rem; font-weight: bold; color: #1a1a2e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-lives { font-size: 0.9rem; color: #c62828; letter-spacing: 1px; margin-top: 4px; min-height: 1.1em; }

    /* ── Turn indicator ── */
    #turn-indicator {
      font-size: 1rem; color: #1a6fb5; font-weight: bold;
      letter-spacing: 1px; min-height: 1.4em;
    }

    /* ── Word timer ── */
    #word-timer-wrap { width: 100%; height: 5px; background: #ddd; border-radius: 3px; overflow: hidden; }
    #word-timer-bar  { height: 100%; background: #53d8fb; border-radius: 3px; width: 100%; transition: none; }
    #word-timer-bar.urgent { background: #e94560; }

    /* ── Word card ── */
    .card {
      background: #fff; border-radius: 14px; padding: 24px;
      width: 100%; font-size: 1.9rem; font-weight: bold; color: #1a1a2e;
      letter-spacing: 1px; min-height: 84px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .card.flash-correct { background: #d4edda; }
    .card.flash-wrong   { background: #f8d7da; }
    .card.flash-timeout { background: #fff3cd; }
    .card.turn-card     { background: #0f2a50; font-size: 1.2rem; color: #53d8fb; }

    #sound-btn { font-size: 0.82rem; color: #444; cursor: pointer; user-select: none; }
    #sound-btn:hover { color: #888; }

    /* ── Choices ── */
    .choices { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .choice-btn {
      width: 100%; padding: 12px 18px; border-radius: 10px;
      border: 2px solid #ddd; background: #fff; color: #1a1a2e;
      font-size: 1rem; cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
      display: flex; align-items: center; gap: 12px;
    }
    .key-hint { font-size: 1rem; opacity: 0.45; flex-shrink: 0; width: 1.2em; text-align: center; }
    .btn-text  { flex: 1; text-align: left; }
    .choice-btn:hover:not(:disabled) { background: #fff5f6; border-color: #53d8fb; }
    .choice-btn.selected-correct { background: #d4edda; border-color: #2a9d47; color: #1a5c2e; }
    .choice-btn.selected-wrong   { background: #f8d7da; border-color: #e94560; color: #e94560; }
    .choice-btn.reveal-correct   { background: #d4edda; border-color: #4caf50; color: #4caf50; }

    #pts-flash {
      font-size: 1.3rem; font-weight: bold; color: #4caf50;
      opacity: 0; transition: opacity 0.25s; height: 28px;
    }

    /* ── Over screen ── */
    .result-icon { font-size: 3rem; }
    #results-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .player-result {
      padding: 11px 14px; border-radius: 10px;
      background: #fff; text-align: left; font-size: 0.9rem;
    }
    .player-result.winner { border: 2px solid #ffc107; }
    .player-result .pr-name { font-weight: bold; font-size: 1rem; }
    .player-result .pr-detail { color: #888; font-size: 0.82rem; margin-top: 3px; }
    .btn-row { display: flex; gap: 10px; }
    .btn-secondary {
      background: #fff; color: #1a1a2e; border: none;
      border-radius: 10px; padding: 12px 28px;
      font-size: 1rem; cursor: pointer; font-weight: bold;
      transition: background 0.2s;
    }
    .btn-secondary:hover { background: #fff5f6; }
  </style>
</head>
<body>

<!-- ══ START SCREEN ══ -->
<div id="start-screen" class="screen active">
  <h1>12ú</h1>
  <p class="subtitle">An Duine Deireanach Beo · 🔊 Fuaim Chonnacht</p>

  <div class="count-row">
    <button class="count-btn" id="btn-minus" onclick="setN(N-1)">−</button>
    <span id="n-display">4 Imreoir</span>
    <button class="count-btn" id="btn-plus"  onclick="setN(N+1)">+</button>
  </div>

  <div id="name-grid"></div>

  <button class="start-btn" onclick="startGame()">Tosaigh</button>
  <p class="hint">3 shaol an duine · 3 soic an focal · freagra laistigh de soicind amháin = +2 pointe</p>
  <p class="hint">↑ ↓ chun freagra a roghnú</p>
</div>

<!-- ══ GAME SCREEN ══ -->
<div id="game-screen" class="screen">
  <div id="panels"></div>
  <div id="turn-indicator">—</div>
  <div id="word-timer-wrap"><div id="word-timer-bar"></div></div>
  <div id="word-card" class="card">—</div>
  <div id="sound-btn" onclick="replayPron()">🔊 arís</div>
  <div class="choices">
    <button class="choice-btn" id="choice-a" onclick="pick(0)"><span class="key-hint">↑</span><span class="btn-text"></span></button>
    <button class="choice-btn" id="choice-b" onclick="pick(1)"><span class="key-hint">↓</span><span class="btn-text"></span></button>
  </div>
  <div id="pts-flash"></div>
</div>

<!-- ══ OVER SCREEN ══ -->
<div id="over-screen" class="screen">
  <div class="result-icon">🏆</div>
  <h2 id="over-title">Buaiteoir!</h2>
  <div id="results-grid"></div>
  <div class="btn-row">
    <button class="btn-secondary" onclick="rematch()">Athimirt</button>
    <button class="btn-secondary" onclick="showStart()">Ainmneacha nua</button>
  </div>
</div>

const WORDS       = Object.keys(DICT);
const WORD_MS     = 3000;
const BONUS_MS    = 1000;
const LIVES_START = 3;

// Player colour palette (border, bg, activeBorder, activeBg, labelColour)
const PALETTE = [
  { border: '#2e7d32', bg: '#edf7ed', aborder: '#2e7d32', abg: '#d4edda', label: '#1a5c2e' },
  { border: '#c62828', bg: '#fdf2f2', aborder: '#c62828', abg: '#f8d7da', label: '#7b1a28' },
  { border: '#e07b00', bg: '#fdf9e6', aborder: '#e07b00', abg: '#fef3c7', label: '#7a3c00' },
  { border: '#757575', bg: '#f5f5f5', aborder: '#757575', abg: '#e5e5e5', label: '#333' },
  { border: '#1565c0', bg: '#eff4fb', aborder: '#1565c0', abg: '#d0e4f7', label: '#0d3a7a' },
];

let N = 4;
let players = [], currentPlayer = 0;
let wordEnd, wordStart, wordRAF;
let correctIdx = 0, locked = false, flashTimer;
let _ca = null, _currentWord = '';
let finalChallenge = false, finalAttemptsLeft = 0;

// ── Player count selector ─────────────────────────────────────────────────────
function setN(n) {
  N = Math.max(2, Math.min(5, n));
  document.getElementById('n-display').textContent = N + (N === 1 ? ' Imreoir' : ' Imreoir');
  document.getElementById('btn-minus').disabled = (N <= 2);
  document.getElementById('btn-plus').disabled  = (N >= 5);
  buildNameGrid();
}

function buildNameGrid() {
  const grid = document.getElementById('name-grid');
  const cols  = N <= 3 ? N : 2;
  grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  // Preserve existing names
  const prev = [];
  for (let i = 1; i <= 5; i++) {
    const el = document.getElementById('name' + i);
    prev.push(el ? el.value : '');
  }
  grid.innerHTML = Array.from({length: N}, (_, i) => {
    const c = PALETTE[i];
    return '<div class="name-field">' +
      '<label style="color:' + c.label + '">Imreoir ' + (i+1) + '</label>' +
      '<input type="text" id="name' + (i+1) + '" placeholder="Ainm..." maxlength="14" autocomplete="off" ' +
      'style="border-color:' + c.border + '" value="' + (prev[i] || '') + '">' +
      '</div>';
  }).join('');
}

// ── Panels ────────────────────────────────────────────────────────────────────
function buildPanels() {
  const panelsEl = document.getElementById('panels');
  const cols = N <= 3 ? N : (N === 4 ? 2 : 3);
  panelsEl.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  panelsEl.innerHTML = Array.from({length: N}, (_, i) =>
    '<div class="panel" id="panel-' + i + '" style="border-color:' + PALETTE[i].border + ';background:' + PALETTE[i].bg + '">' +
      '<div class="p-name" id="p-name-' + i + '">' + players[i].name + '</div>' +
      '<div class="p-lives" id="p-lives-' + i + '">♥♥♥</div>' +
    '</div>'
  ).join('');
}

function updatePanels() {
  players.forEach((p, i) => {
    const panel = document.getElementById('panel-' + i);
    const c = PALETTE[i];
    const isActive = (i === currentPlayer && p.lives > 0);
    panel.style.borderColor = isActive ? c.aborder : c.border;
    panel.style.background  = isActive ? c.abg    : c.bg;
    panel.classList.toggle('dead', p.lives <= 0);
    document.getElementById('p-name-' + i).textContent = p.name;
    const lh = p.lives <= 0 ? '💀' : '♥'.repeat(Math.min(p.lives, 6)) + (p.lives > 6 ? '×' + p.lives : '');
    document.getElementById('p-lives-' + i).textContent = lh;
  });
  document.getElementById('turn-indicator').textContent = players[currentPlayer].name + ' — do sheal!';
}

// ── Screens ───────────────────────────────────────────────────────────────────
function show(id) {
  ['start-screen','game-screen','over-screen'].forEach(s =>
    document.getElementById(s).classList.toggle('active', s === id));
}
function showStart() { show('start-screen'); }

// ── Init ──────────────────────────────────────────────────────────────────────
function startGame() {
  players = Array.from({length: N}, (_, i) => ({
    name: (document.getElementById('name' + (i+1)).value.trim()) || ('Imreoir ' + (i+1)),
    lives: LIVES_START, score: 0
  }));
  currentPlayer = 0; locked = false; finalChallenge = false; finalAttemptsLeft = 0;
  buildPanels();
  show('game-screen');
  beginTurn();
}

function rematch() {
  players.forEach(p => { p.lives = LIVES_START; p.score = 0; });
  currentPlayer = 0; locked = false; finalChallenge = false; finalAttemptsLeft = 0;
  buildPanels();
  show('game-screen');
  beginTurn();
}

// ── Alive helpers ─────────────────────────────────────────────────────────────
function countAlive() { return players.filter(p => p.lives > 0).length; }
function nextAlive(from) {
  let idx = (from + 1) % N;
  for (let i = 0; i < N; i++) {
    if (players[idx].lives > 0) return idx;
    idx = (idx + 1) % N;
  }
  return from;
}

// ── Final challenge ──────────────────────────────────────────────────────────
function startFinalChallenge() {
  finalChallenge = true;
  finalAttemptsLeft = players[currentPlayer].lives;
  beginTurn();
}

// ── Audio ─────────────────────────────────────────────────────────────────────
function playPron(word) {
  if (_ca) { _ca.pause(); _ca = null; }
  const a = new Audio('https://www.teanglann.ie/CanC/' + encodeURIComponent(word) + '.mp3');
  a.onerror = function(){};
  a.play().catch(function(){});
  _ca = a;
}
function replayPron() { if (_currentWord) playPron(_currentWord); }

// ── Word helpers ──────────────────────────────────────────────────────────────
function sh(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function rnd(exclude) {
  let w;
  do { w = WORDS[Math.floor(Math.random()*WORDS.length)]; } while (w === exclude);
  return w;
}

// ── Turn flow ─────────────────────────────────────────────────────────────────
function beginTurn() {
  locked = true;
  cancelAnimationFrame(wordRAF);
  const fcMsg = finalChallenge
    ? 'Dúshlán Deireanach! Iarrachtaí fágtha: ' + finalAttemptsLeft
    : players[currentPlayer].name + ' — do sheal!';
  document.getElementById('word-card').textContent = fcMsg;
  document.getElementById('word-card').className = 'card turn-card';
  document.getElementById('word-timer-bar').style.width = '100%';
  document.getElementById('word-timer-bar').className = '';
  const btns = [document.getElementById('choice-a'), document.getElementById('choice-b')];
  btns.forEach(b => { b.querySelector('.btn-text').textContent = ''; b.disabled = true; });
  document.getElementById('pts-flash').style.opacity = '0';
  updatePanels();
  setTimeout(() => { locked = false; nextWord(); }, 900);
}

function nextWord() {
  if (locked) return;
  const word    = WORDS[Math.floor(Math.random()*WORDS.length)];
  const correct = DICT[word][0];
  const wrong   = DICT[rnd(word)][0];
  const opts    = sh([correct, wrong]);
  correctIdx    = opts.indexOf(correct);
  _currentWord  = word;
  wordStart     = Date.now();

  document.getElementById('word-card').textContent = word;
  document.getElementById('word-card').className   = 'card';

  const btns = [document.getElementById('choice-a'), document.getElementById('choice-b')];
  btns.forEach((b, i) => {
    b.querySelector('.btn-text').textContent = opts[i];
    b.className = 'choice-btn';
    b.disabled  = false;
  });

  playPron(word);
  cancelAnimationFrame(wordRAF);
  wordEnd = Date.now() + WORD_MS;
  tickWord();
}

function tickWord() {
  const rem = wordEnd - Date.now();
  if (rem <= 0) {
    document.getElementById('word-timer-bar').style.width = '0%';
    document.getElementById('word-timer-bar').className = 'urgent';
    document.getElementById('word-card').className = 'card flash-timeout';
    const btns = [document.getElementById('choice-a'), document.getElementById('choice-b')];
    btns.forEach(b => b.disabled = true);
    locked = true;
    if (finalChallenge) {
      finalAttemptsLeft--;
      if (finalAttemptsLeft <= 0) { setTimeout(() => endGame(false), 700); return; }
      setTimeout(() => beginTurn(), 950);
    } else {
      players[currentPlayer].lives--;
      updatePanels();
      if (countAlive() <= 1) { setTimeout(() => startFinalChallenge(), 700); return; }
      setTimeout(() => { currentPlayer = nextAlive(currentPlayer); beginTurn(); }, 950);
    }
    return;
  }
  const pct = (rem / WORD_MS) * 100;
  const bar = document.getElementById('word-timer-bar');
  bar.style.width = pct + '%';
  bar.className   = rem <= 1500 ? 'urgent' : '';
  wordRAF = requestAnimationFrame(tickWord);
}

// ── Pick ──────────────────────────────────────────────────────────────────────
function pick(idx) {
  if (locked) return;
  locked = true;
  cancelAnimationFrame(wordRAF);

  const elapsed = Date.now() - wordStart;
  const btns    = [document.getElementById('choice-a'), document.getElementById('choice-b')];
  btns.forEach(b => b.disabled = true);

  if (idx === correctIdx) {
    if (finalChallenge) {
      btns[idx].className = 'choice-btn selected-correct';
      document.getElementById('word-card').className = 'card flash-correct';
      showFlash('🏆 Buaite!');
      setTimeout(() => endGame(true), 850);
    } else {
      const pts = elapsed < BONUS_MS ? 2 : 1;
      players[currentPlayer].score += pts;
      btns[idx].className = 'choice-btn selected-correct';
      document.getElementById('word-card').className = 'card flash-correct';
      showFlash(pts === 2 ? '⚡ +2' : '+1');
      updatePanels();
      setTimeout(() => { currentPlayer = nextAlive(currentPlayer); beginTurn(); }, 850);
    }
  } else {
    if (finalChallenge) {
      finalAttemptsLeft--;
      btns[idx].className = 'choice-btn selected-wrong';
      btns[correctIdx].className = 'choice-btn reveal-correct';
      document.getElementById('word-card').className = 'card flash-wrong';
      if (finalAttemptsLeft <= 0) {
        setTimeout(() => endGame(false), 800);
      } else {
        setTimeout(() => beginTurn(), 950);
      }
    } else {
      players[currentPlayer].lives--;
      btns[idx].className = 'choice-btn selected-wrong';
      btns[correctIdx].className = 'choice-btn reveal-correct';
      document.getElementById('word-card').className = 'card flash-wrong';
      updatePanels();
      if (countAlive() <= 1) {
        setTimeout(() => startFinalChallenge(), 800);
      } else {
        setTimeout(() => { currentPlayer = nextAlive(currentPlayer); beginTurn(); }, 950);
      }
    }
  }
}

function showFlash(txt) {
  const el = document.getElementById('pts-flash');
  el.textContent = txt;
  el.style.opacity = '1';
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { el.style.opacity = '0'; }, 800);
}

// ── End game ──────────────────────────────────────────────────────────────────
function endGame(won = true) {
  cancelAnimationFrame(wordRAF);
  locked = true;
  finalChallenge = false;
  if (_ca) { _ca.pause(); _ca = null; }

  const ranked = players.map((p, i) => ({ ...p, idx: i }))
    .sort((a, b) => b.lives - a.lives || b.score - a.score);

  if (won) {
    document.getElementById('over-title').textContent = ranked[0].name + ' buaite! 🏆';
  } else {
    document.getElementById('over-title').textContent = 'Cluiche Cothrom! 🤝';
  }

  const cols = N <= 3 ? N : 2;
  const rg = document.getElementById('results-grid');
  rg.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  rg.innerHTML = ranked.map((p, rank) =>
    '<div class="player-result' + (rank === 0 ? ' winner' : '') + '" ' +
    'style="border-color:' + PALETTE[p.idx].border + '">' +
      '<div class="pr-name">' + p.name + (rank === 0 ? ' 🏆' : p.lives <= 0 ? ' 💀' : '') + '</div>' +
      '<div class="pr-detail">Scór: ' + p.score + ' · Saolta: ' + Math.max(0, p.lives) + '</div>' +
    '</div>'
  ).join('');

  show('over-screen');
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const inInput = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (e.key === 'ArrowUp'   || (!inInput && (e.key === 'w' || e.key === 'W'))) { e.preventDefault(); pick(0); }
  if (e.key === 'ArrowDown' || (!inInput && (e.key === 's' || e.key === 'S'))) { e.preventDefault(); pick(1); }
  if (e.key === 'Enter' && document.getElementById('start-screen').classList.contains('active')) startGame();
});

// ── Boot ──────────────────────────────────────────────────────────────────────
setN(4);
show('start-screen');
</script>
