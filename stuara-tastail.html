<!DOCTYPE html>
<html lang="ga">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tástáil Stuara</title>
<script>window.ARCADE_FORCE = true;</script>
<script src="arcade.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f5f0; color: #1a1a2e; padding: 2rem 1rem; text-align: center; }
  h1 { color: #e94560; font-size: 1.8rem; margin-bottom: .3rem; }
  p { color: #888; font-size: .9rem; margin-bottom: 1.4rem; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; max-width: 760px; margin: 0 auto; }
  .st { background: #fff; border-radius: 16px; padding: 1rem; box-shadow: 0 2px 12px rgba(0,0,0,.07); border: 3px solid transparent; transition: border-color .1s; }
  .st h2 { font-size: 1.1rem; margin-bottom: .7rem; }
  .pad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 6px; justify-content: center; }
  .b { border-radius: 12px; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #999; transition: background .1s, color .1s; }
  .b.hit { color: #fff; }
  .last { margin-top: .7rem; font-size: .8rem; color: #888; height: 1.1rem; }
  #pads { margin-top: 1.4rem; font-size: .85rem; color: #666; }
</style>
</head>
<body>
<h1>🕹️ Tástáil Stuara</h1>
<p>Brúigh cnaipe ar gach stáisiún. Ba cheart don bhosca ceart lasadh.<br>Press each button at each station: the matching box should light up.</p>
<div class="grid" id="grid"></div>
<div id="pads"></div>
<script>
const PCOLS = ['#e94560', '#1565c0', '#2a9d47', '#e07b00'];
const POS = { up: 2, left: 4, ok: 5, right: 6, down: 8 }, SYM = { up: '↑', down: '↓', left: '←', right: '→', ok: 'OK' };
const grid = document.getElementById('grid');
for (let s = 0; s < 4; s++) {
  let cells = '';
  for (let c = 1; c <= 9; c++) { const a = Object.keys(POS).find(k => POS[k] === c); cells += a ? '<div class="b" id="b' + s + a + '">' + SYM[a] + '</div>' : '<div></div>'; }
  grid.innerHTML += '<div class="st" id="st' + s + '"><h2 style="color:' + PCOLS[s] + '">Stáisiún ' + (s + 1) + '</h2><div class="pad">' + cells + '</div><div class="last" id="l' + s + '"></div></div>';
}
Arcade.listen((s, a, src) => {
  const b = document.getElementById('b' + s + a), st = document.getElementById('st' + s);
  if (!b) return;
  b.classList.add('hit'); b.style.background = PCOLS[s]; st.style.borderColor = PCOLS[s];
  document.getElementById('l' + s).textContent = SYM[a] + ' · ' + (src === 'pad' ? 'gamepad' : 'méarchlár / keyboard');
  setTimeout(() => { b.classList.remove('hit'); b.style.background = ''; st.style.borderColor = 'transparent'; }, 250);
});
function showPads() { const p = Arcade.pads(); document.getElementById('pads').textContent = p.length ? 'Gamepads: ' + p.join(' · ') : 'Gamepads: níl aon cheann aimsithe fós (brúigh cnaipe)'; }
window.addEventListener('gamepadconnected', showPads); window.addEventListener('gamepaddisconnected', showPads); showPads();
</script>
</body>
</html>
